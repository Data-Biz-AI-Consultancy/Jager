name: CI Test Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'uv.lock'
              - 'tests/**'

  test-docker:
    name: Docker Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create stub .env
        run: |
          cat > .env <<'EOF'
          MOTHERDUCK_TOKEN=dummy
          MOTHERDUCK_DATABASE=staging
          NOTION_API_KEY=dummy
          NOTION_MANUAL_INGESTION_PAGE_ID=dummy
          TUNNEL_TOKEN=dummy
          SLACK_OAUTH_TOKEN=dummy
          SLACK_APP_TOKEN=dummy
          SLACK_GIUSY_OAUTH_TOKEN=dummy
          SLACK_GIUSY_APP_TOKEN=dummy
          OLLAMA_API_KEY=dummy
          LINKEDIN_MEMBER_DATA_PORTABILITY_API_TOKEN=dummy
          LINKEDIN_SHARE_ON_APP_CLIENT_ID=dummy
          LINKEDIN_SHARE_ON_APP_CLIENT_PRIMARY_CLIENT_SECRET=dummy
          NOTION_SUBSTACK_POSTS_GENERATION_API_KEY=dummy
          BUFFER_API_KEY=dummy
          HUGGING_FACE_TOKEN=dummy
          EOF

      - name: Run Dockerfile Context Unit Test
        run: node tests/integration/test-dockerfile.js

      - name: Validate Docker Compose configuration
        run: |
          docker network create jager_network || true
          docker compose config --quiet

      - name: Cache Docker base images
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images.tar
          key: docker-images-${{ runner.os }}-${{ hashFiles('src/n8n/Dockerfile', 'docker-compose.yml') }}

      - name: Load cached Docker images
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-images.tar

      - name: Start services (Build & Up)
        run: |
          docker network create jager_network || true
          docker compose --profile app up -d --build db n8n

      - name: Save Docker images to cache
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          docker save pgvector/pgvector:pg15 $(docker images --filter "reference=*n8n*" -q | head -n 1) -o /tmp/docker-images.tar

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== DB logs ==="
          docker compose logs db --tail 50
          echo "=== N8N logs ==="
          docker compose logs n8n --tail 50

  test-python:
    name: Python Tests
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Python Backend Tests
        env:
          PYTHONPATH: src
        run: uv run --with pytest --with scikit-learn --with pandas --with fastapi --with httpx --with numpy --with sqlalchemy --with psycopg2-binary --with dlt --with feedparser --with beautifulsoup4 pytest tests/

  # On merge to main (push): publish custom n8n image to GHCR as :staging
  publish-ghcr:
    name: Publish GHCR (staging)
    needs: [test-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image name
        id: repo
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.IMAGE }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=sha-,format=short
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/n8n/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pull hints
        run: |
          IMAGE="${{ steps.repo.outputs.IMAGE }}"
          echo "==> Staging n8n image:"
          echo "    docker pull ${IMAGE}:staging"
          echo "    docker pull ${IMAGE}:sha-${GITHUB_SHA}"

