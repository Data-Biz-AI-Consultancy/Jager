name: CI Test Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      python: ${{ steps.filter.outputs.python }}
      dbt: ${{ steps.filter.outputs.dbt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'docker-compose*.yml'
              - 'docker-compose*.yaml'
              - 'Dockerfile*'
              - '**/Dockerfile*'
              - 'src/db/**'
              - 'tests/integration/test-dockerfile.js'
              - '.github/workflows/ci.yml'
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'uv.lock'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            dbt:
              - 'src/dapp/dbt/**'
              - 'dbt/**'
              - '.github/workflows/ci.yml'

  test-docker:
    name: Docker Tests
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create stub .env
        run: |
          cat > .env <<'EOF'
          MOTHERDUCK_TOKEN=dummy
          MOTHERDUCK_DATABASE=staging
          NOTION_API_KEY=dummy
          NOTION_MANUAL_INGESTION_PAGE_ID=dummy
          TUNNEL_TOKEN=dummy
          SLACK_OAUTH_TOKEN=dummy
          SLACK_APP_TOKEN=dummy
          SLACK_GIUSY_OAUTH_TOKEN=dummy
          SLACK_GIUSY_APP_TOKEN=dummy
          OLLAMA_API_KEY=dummy
          LINKEDIN_MEMBER_DATA_PORTABILITY_API_TOKEN=dummy
          LINKEDIN_SHARE_ON_APP_CLIENT_ID=dummy
          LINKEDIN_SHARE_ON_APP_CLIENT_PRIMARY_CLIENT_SECRET=dummy
          NOTION_SUBSTACK_POSTS_GENERATION_API_KEY=dummy
          BUFFER_API_KEY=dummy
          HUGGING_FACE_TOKEN=dummy
          EOF

      - name: Run Dockerfile Context Unit Test
        run: node tests/integration/test-dockerfile.js

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build images (db + n8n)
        run: docker compose --profile app build db n8n

      - name: Start services
        run: docker compose --profile app up -d db n8n

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== DB logs ==="
          docker compose logs db --tail 50
          echo "=== N8N logs ==="
          docker compose logs n8n --tail 50


      - name: Tear down
        if: always()
        run: docker compose --profile app down --remove-orphans --volumes


  test-python:
    name: Python Tests
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Python Backend Tests
        env:
          PYTHONPATH: src
        run: uv run --with pytest --with scikit-learn --with pandas --with fastapi --with httpx --with numpy --with sqlalchemy --with psycopg2-binary --with dlt --with feedparser --with beautifulsoup4 pytest tests/


  dbt-compile:
    name: dbt Compile
    needs: changes
    if: ${{ needs.changes.outputs.dbt == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: dbt compile (CI target - local DuckDB)
        working-directory: src/dapp/dbt
        run: dbt compile --target ci --profiles-dir .
