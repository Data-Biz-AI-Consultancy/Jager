name: CI Test Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      dbt: ${{ steps.filter.outputs.dbt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'uv.lock'
              - 'tests/**'
            dbt:
              - 'src/dapp/dbt/**'
              - 'dbt/**'

  test-docker:
    name: Docker Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create stub .env
        run: |
          cat > .env <<'EOF'
          MOTHERDUCK_TOKEN=dummy
          MOTHERDUCK_DATABASE=staging
          NOTION_API_KEY=dummy
          NOTION_MANUAL_INGESTION_PAGE_ID=dummy
          TUNNEL_TOKEN=dummy
          SLACK_OAUTH_TOKEN=dummy
          SLACK_APP_TOKEN=dummy
          SLACK_GIUSY_OAUTH_TOKEN=dummy
          SLACK_GIUSY_APP_TOKEN=dummy
          OLLAMA_API_KEY=dummy
          LINKEDIN_MEMBER_DATA_PORTABILITY_API_TOKEN=dummy
          LINKEDIN_SHARE_ON_APP_CLIENT_ID=dummy
          LINKEDIN_SHARE_ON_APP_CLIENT_PRIMARY_CLIENT_SECRET=dummy
          NOTION_SUBSTACK_POSTS_GENERATION_API_KEY=dummy
          BUFFER_API_KEY=dummy
          HUGGING_FACE_TOKEN=dummy
          EOF

      - name: Run Dockerfile Context Unit Test
        run: node tests/integration/test-dockerfile.js

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Cache Docker base images
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images.tar
          key: docker-images-${{ runner.os }}-${{ hashFiles('src/n8n/Dockerfile', 'docker-compose.yml') }}

      - name: Load cached Docker images
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-images.tar

      - name: Start services (Build & Up)
        run: docker compose --profile app up -d --build db n8n

      - name: Save Docker images to cache
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: docker save pgvector/pgvector:pg15 n8nio/n8n:2.33.5 -o /tmp/docker-images.tar

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== DB logs ==="
          docker compose logs db --tail 50
          echo "=== N8N logs ==="
          docker compose logs n8n --tail 50

  test-python:
    name: Python Tests
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Python Backend Tests
        env:
          PYTHONPATH: src
        run: uv run --with pytest --with scikit-learn --with pandas --with fastapi --with httpx --with numpy --with sqlalchemy --with psycopg2-binary --with dlt --with feedparser --with beautifulsoup4 pytest tests/


  dbt-compile:
    name: dbt Compile
    needs: changes
    if: ${{ needs.changes.outputs.dbt == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: dbt compile (CI target - local DuckDB)
        working-directory: src/dapp/dbt
        run: dbt compile --target ci --profiles-dir .
