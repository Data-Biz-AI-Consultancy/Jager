
services:
  db:
    image: pgvector/pgvector:pg15
    restart: always
    profiles:
      - core
      - app
      - data
      - all
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    environment:
      POSTGRES_DB: jager
      POSTGRES_USER: jager
      POSTGRES_PASSWORD: jager
      CI: ${CI:-false}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
      - ./src/db/sql:/docker-entrypoint-initdb.d/sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jager -d jager"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  n8n:
    build:
      context: ./
      dockerfile: src/n8n/Dockerfile
    restart: always
    profiles:
      - app
      - all
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: '1.0'
    expose:
      - "5678"
    environment:
      - N8N_ENV=${N8N_ENV:-production}
      - CI=${CI:-false}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=jager
      - DB_POSTGRESDB_PASSWORD=jager
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - SLACK_OAUTH_TOKEN=${SLACK_OAUTH_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SLACK_GIUSY_OAUTH_TOKEN=${SLACK_GIUSY_OAUTH_TOKEN}
      - SLACK_GIUSY_APP_TOKEN=${SLACK_GIUSY_APP_TOKEN}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - LINKEDIN_MEMBER_DATA_PORTABILITY_API_TOKEN=${LINKEDIN_MEMBER_DATA_PORTABILITY_API_TOKEN}
      - LINKEDIN_SHARE_ON_APP_CLIENT_ID=${LINKEDIN_SHARE_ON_APP_CLIENT_ID}
      - LINKEDIN_SHARE_ON_APP_CLIENT_SECRET=${LINKEDIN_SHARE_ON_APP_CLIENT_PRIMARY_CLIENT_SECRET}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_SUBSTACK_POSTS_GENERATION_API_KEY=${NOTION_SUBSTACK_POSTS_GENERATION_API_KEY}
      - BUFFER_API_KEY=${BUFFER_API_KEY}
      - HUGGING_FACE_TOKEN=${HUGGING_FACE_TOKEN}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://dapp:8000}
      - WEBHOOK_URL=${WEBHOOK_URL:-https://jager.n8n.com/}
      - GENERIC_TIMEZONE=Europe/Berlin
      - N8N_PROXY_HOPS=1
      - MOTHERDUCK_TOKEN=${MOTHERDUCK_TOKEN}
      - MOTHERDUCK_DATABASE=${MOTHERDUCK_DATABASE:-staging}
      - MOTHERDUCK_HOST=${MOTHERDUCK_HOST:-pg.us-east-1-aws.motherduck.com}
      - MOTHERDUCK_USER=${MOTHERDUCK_USER:-postgres}
      - DATA_PIPELINE_URL=${DATA_PIPELINE_URL:-http://dapp:8000}
      - CDP_SERVICE_URL=${CDP_SERVICE_URL:-http://cdp:8000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
      - ./src/n8n/workflows:/etc/n8n/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  dapp:
    build:
      context: ./
      dockerfile: src/dapp/Dockerfile
    restart: always
    profiles:
      - data
      - all
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.5'
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=postgresql://jager:jager@db:5432/jager
      - MOTHERDUCK_TOKEN=${MOTHERDUCK_TOKEN}
      - MOTHERDUCK_DATABASE=${MOTHERDUCK_DATABASE:-staging}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_MANUAL_INGESTION_PAGE_ID=${NOTION_MANUAL_INGESTION_PAGE_ID}
    depends_on:
      db:
        condition: service_started


  cdp:
    build:
      context: ./
      dockerfile: src/cdp/Dockerfile
    restart: always
    profiles:
      - app
      - all
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.5'
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=postgresql://jager:jager@db:5432/cdp
      - JAGER_DATABASE_URL=postgresql://jager:jager@db:5432/jager
      - MOTHERDUCK_TOKEN=${MOTHERDUCK_TOKEN}
      - MOTHERDUCK_DATABASE=${MOTHERDUCK_DATABASE:-staging}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_MANUAL_INGESTION_PAGE_ID=${NOTION_MANUAL_INGESTION_PAGE_ID}
    depends_on:
      db:
        condition: service_started
    volumes:
      - ./src/cdp:/app
      - ./src/shared:/app/src/shared


  caddy:
    image: caddy:alpine
    restart: unless-stopped
    profiles:
      - core
      - app
      - all
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      n8n:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    profiles:
      - core
      - app
      - all
    deploy:
      resources:
        limits:
          memory: 96m
          cpus: '0.25'
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - caddy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  n8n_data:
